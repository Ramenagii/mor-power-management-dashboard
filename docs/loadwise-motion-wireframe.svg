      <rect x="72.5" y="102" width="7" height="15.5" rx="2" fill="#111827"/>
      <path d="M60.5 125c0-3.5 2.5-6 5.5-6s5.5 2.5 5.5 6v8h-11v-8Z" fill="#111827"/>
