    <rect x="292" y="316" width="276" height="30" rx="15" fill="#edf7fb" stroke="#c7e4f2"/>
    <text x="334" y="336" fill="#0677ad" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700">layoutId: loadwise-route-surface</text>
  </g>

  <g transform="translate(972 500)">
    <rect width="412" height="360" rx="10" fill="white" stroke="#e8e5df"/>
