      <rect x="602" y="166" width="210" height="28" rx="6" fill="#edf7fb"/>
      <rect x="602" y="216" width="92" height="46" rx="6" fill="white" stroke="#e8e5df"/>
      <rect x="712" y="216" width="92" height="46" rx="6" fill="white" stroke="#e8e5df"/>
