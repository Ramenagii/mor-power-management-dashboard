      <rect x="324" y="216" width="92" height="46" rx="6" fill="white" stroke="#e8e5df"/>
      <rect x="434" y="216" width="92" height="46" rx="6" fill="white" stroke="#e8e5df"/>
      <rect x="584" y="112" width="248" height="190" rx="8" fill="#fbfbfa" stroke="#e8e5df"/>
