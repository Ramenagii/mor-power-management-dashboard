    <g fill="#78746d" font-family="Inter, Arial, sans-serif" font-size="13">
      <text x="76" y="104">Logo handoff: shared layout from intro to header.</text>
      <text x="76" y="164">Hamburger menu: compact overlay with staggered items.</text>
      <text x="76" y="224">Route surface: Dashboard, Policies, Hardware swap inside one animated area.</text>
      <text x="76" y="284">Reduced motion: large transforms are softened when preferred.</text>
    </g>
